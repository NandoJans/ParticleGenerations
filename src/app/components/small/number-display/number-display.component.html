<div>
  <span>
    <p>{{ holdingDisplay.getAmountPrefix() }}</p>
    <p [class]="holding.getStyle()">{{ getHoldingAmount() }}</p>
    <p>{{ holdingDisplay.getAmountSuffix() }}</p>
  </span>
  <span *ngIf="hasHoldingEffect()">
    <p>{{ holdingDisplay.getEffectPrefix() }}</p>
    <p>{{ getHoldingEffect() }}</p>
    <p>{{ holdingDisplay.getEffectSuffix() }}</p>
  </span>
</div>
