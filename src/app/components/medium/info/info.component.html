<div class="holding-line">
  <app-button [style]="'info-button'" [text]="'Info'" (function)="show()"></app-button>
</div>
<div class="no-display pop-up-window" [id]="name" [style]="(getHidden()) ? 'display: none;' : 'display: flex;'">
  <p class="info" *ngFor="let textPiece of text">{{textPiece}}</p>
  <div class="pop-up-bottom"></div>
  <div class="holding-line">
    <app-button style="width: 100%" [style]="'exit-button'" [text]="'Exit'" (function)="hide()"></app-button>
  </div>
</div>
