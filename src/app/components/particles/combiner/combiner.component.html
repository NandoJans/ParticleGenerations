<div [class]="'combiner '+style" [id]="name">
  <h4>{{ displayName }}</h4>
  <app-button (function)="assignCombiner()" [text]="'Assign'" [style]="'normal-button no-display'" [identifier]="'assign-button-'+name"></app-button>
  <app-buyable style="width: 100%;" [name]="name" [cost]="cost" [currency]="currency"></app-buyable>
</div>
