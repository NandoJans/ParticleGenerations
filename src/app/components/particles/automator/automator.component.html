<div [class]="
'automator '+automator.style+' '
+((isPrestigeAutomator()) ? 'prestige' : '')+' '
" [id]="automator.name">
  <h4>{{ automator.displayName }}</h4>
  <div *ngIf="completed()" [class]="'automator-form '+((isPrestigeAutomator()) ? 'prestige' : '')+' '" (change)="onChange()">
    <button
      *ngIf="isPrestigeAutomator() && getMode() === 'atX'"
      class="button prestige yellow"
      (click)="switchMode('afterXSeconds')"
    >At X</button>
    <button
      *ngIf="isPrestigeAutomator() && getMode() === 'afterXSeconds'"
      class="button prestige green"
      (click)="switchMode('afterXTimesBest')"
    >After X Seconds</button>
    <button
      *ngIf="isPrestigeAutomator() && getMode() === 'afterXTimesBest'"
      class="button prestige blue"
      (click)="switchMode('atX')"
    >X times best</button>
    <input *ngIf="isPrestigeAutomator()" type="text" (change)="setSetting($event)" [value]="getSetting()"/>
    <input *ngIf="hasMaxBuys()" type="text" (change)="setMaxBuys($event)" [value]="getMaxBuys()"/>
    <p class="prestige-status" *ngIf="isPrestigeAutomator()">{{ getPrestigeStatus() }}</p>
    <div class="active-row">
      <label>Active: </label>
      <input
        type="checkbox"
        class="checkbox"
        [id]="automator.name"
        [name]="automator.name"
        [value]="automator.name"
        [checked]="getActive()"
        (change)="setActive($event)"
      />
    </div>
  </div>
  <div *ngIf="!completed()">
    <p>{{ getGoalString() }}</p>
    <div class="progress-bar">
      <div class="progress" [style.width]="getProgressPercentage() + '%'"></div>
    </div>
    <p>{{ getProgressString() }}</p>
  </div>
</div>
