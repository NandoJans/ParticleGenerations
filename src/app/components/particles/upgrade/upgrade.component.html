<button [class]="'upgrade '+style" [id]="'buyable-'+name" (click)="buy()">
  <h4>{{ displayName }}</h4>
  <p>{{ description }}</p>
  <app-number-display [name]="name" [style]="''" [type]="'effect'" [effect]="effect"></app-number-display>
  <app-number-display [name]="name" [style]="''" [type]="'cost'" [currency]="currency"></app-number-display>
  <div class="challenge-disabled" style="display: none;">
    <h2>Challenge Disabled</h2>
  </div>
</button>
