<button
  [id]="'buyable-'+upgrade.name"
  [class]="'upgrade '+upgrade.style+' '
  +((getIsBuyable()) ? 'buyable' : '')+' '
  +((getIsMaxed()) ? 'maxed' : '')+' '
  +((isEnhancing()) ? 'enhancing enhancing-' + getEnhancementStyle() : '')+' '
  +((isEnhanced()) ? 'enhanced enhanced-' + getEnhancedStyle() : '')+' '
"
  (click)="buy()"
>
  <h4 *ngIf="getDisplayName() !== ''">{{ getDisplayName() }}</h4>
  <p class="description" *ngIf="getDescription() !== '' && !isEnhancing()">{{ getDescription() }}</p>
  <p *ngIf="isEnhancing()">{{ getEnhancementString() }}</p>
  <p *ngIf="getEffect()" class="effect">{{ getEffect() }}</p>
  <p *ngIf="!getIsMaxed()" class="cost">Cost: {{ getCost() }} {{ getCurrencyAbbreviation() }}</p>
  <div class="challenge-disabled" style="display: none;">
    <h2>Challenge Disabled</h2>
  </div>
</button>
