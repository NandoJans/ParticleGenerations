
<div [class]="'click-title'" (click)="toggle()">
  <h2>{{ title }}</h2>
  @if (isOpen()) {
    <fa-icon [icon]="faChevronUp"></fa-icon>
  } @else {
    <fa-icon [icon]="faChevronDown"></fa-icon>
  }
</div>
<div [class]="'upgrade-row '+(isOpen() ? 'open' : 'closed')">
  @for (automator of automators; track automator.name) {
    @if (automator.isFirstUnlocked()) {
      <app-automator [automator]="automator"></app-automator>
    }
  }
</div>
