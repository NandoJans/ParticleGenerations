<app-number-display
  [holding]="holdingRecord.getPurples()"
></app-number-display>
<div class="holding-line">
  <p class="holding-prefix">Your best Purple Particles is </p>
  <p [style]="'purple-text holding-amount'">{{ getMaxPurpleParticleGainSpeed() }}</p>
  <p class="holding-prefix">/ Second</p>
</div>
<div class="upgrade-row">
  <div *ngFor="let milestone of milestones">
    <app-milestone *ngIf="milestone.unlocked" [milestone]="milestone"></app-milestone>
  </div>
</div>
