<app-number-display [holding]="holdingRecord.getGreenPurple()"></app-number-display>
<div class="generators-row">
  <div *ngFor="let generator of greenPurpleGeneratorRecord.getList()">
    <app-generator *ngIf="generator.unlocked" [generator]="generator"></app-generator>
  </div>
</div>
<div class="upgrade-row">
  <div *ngFor="let upgrade of greenPurpleUpgradeRecord.getList()">
    <app-upgrade *ngIf="upgrade.unlocked" [upgrade]="upgrade"></app-upgrade>
  </div>
</div>
