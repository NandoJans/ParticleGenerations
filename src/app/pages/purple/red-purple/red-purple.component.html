<div class="holding-line">
  <p class="holding-prefix">You have </p>
  <app-number-display [name]="'redPurple'" [style]="'red-purple-text pre-purple-text holding-amount'" [type]="'currency'"></app-number-display>
  <p class="holding-prefix"> Red Purple</p>
</div>
<div class="holding-line">
  <p class="holding-prefix">Which is boosted by </p>
  <app-number-display [name]="'purpleVoid'" [style]="'purple-text holding-amount'" [type]="'currency'"></app-number-display>
  <p class="holding-prefix"> Purple Void</p>
</div>
<div class="holding-line">
  <p class="holding-prefix">They increase the multiplier of red extensions by</p>
  <app-number-display [name]="'redPurple'" [style]="'red-purple-text pre-purple-text holding-amount'" [type]="'holdingEffect'"></app-number-display>
</div>
<div class="generators-row">
  <div *ngFor="let generator of generators">
    <app-generator *ngIf="generator.unlocked" [generator]="generator"></app-generator>
  </div>
</div>
<div class="upgrade-row">
  <div *ngFor="let upgrade of upgrades">
    <app-upgrade *ngIf="upgrade.unlocked" [upgrade]="upgrade"></app-upgrade>
  </div>
</div>
