<app-number-display [holding]="holdingRecord.getRedAccelerators()"></app-number-display>
<div class="generators-row">
  <div *ngFor="let generator of acceleratorGeneratorRecord.getList()">
    <app-generator *ngIf="generator.unlocked" [generator]="generator"></app-generator>
  </div>
</div>
<div class="upgrade-row">
  <div *ngFor="let upgrade of acceleratorUpgradeService.getList()">
    <app-upgrade *ngIf="upgrade.unlocked" [upgrade]="upgrade"></app-upgrade>
  </div>
</div>
<app-info style="width: 60%" [name]="'red-accelerators-info'" [text]="infoText"></app-info>
