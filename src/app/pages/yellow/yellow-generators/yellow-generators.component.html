<app-number-display [holding]="holdingRecord.getYellowPower()"></app-number-display>
<div class="generators-row">
  <div *ngFor="let generator of generators">
    <app-generator *ngIf="generator.unlocked" [generator]="generator"></app-generator>
  </div>
</div>
<app-particle-emitter style="width: 100%; height: 100%;" [type]="'yellow-particle-emitter'"></app-particle-emitter>
