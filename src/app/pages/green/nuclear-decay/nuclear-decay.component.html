<div class="holding-line">
  <p class="holding-prefix">You have </p>
  <app-number-display [name]="'greenSouls'" [style]="'green-text holding-amount'" [type]="'currency'"></app-number-display>
  <p class="holding-prefix">Green Souls</p>
</div>
<div class="holding-line">
  <p class="holding-prefix">You have </p>
  <app-number-display [name]="'nuclearDecay'" [style]="'green-text holding-amount'" [type]="'currency'"></app-number-display>
  <p class="holding-prefix">Nuclear Decay</p>
</div>
<div class="holding-line">
  <p class="holding-prefix">They increase the power of red generator boosters by</p>
  <app-number-display [name]="'nuclearDecay'" [style]="'green-text holding-amount'" [type]="'effect'" [effect]="effect"></app-number-display>
</div>
<div class="generators-row">
  <div *ngFor="let generator of generators">
    <app-generator *ngIf="generator.unlocked" [generator]="generator"></app-generator>
  </div>
</div>
<div class="generators-row">
  <div *ngFor="let upgrade of upgrades">
    <app-upgrade *ngIf="upgrade.unlocked" [upgrade]="upgrade"></app-upgrade>
  </div>
</div>
<div class="holding-line">
  <app-button [text]="'Reset Nuclear Decay'" (click)="respecSouls()" [style]="'sacrifice-button'"></app-button>
</div>
<app-particle-emitter style="width: 100%; height: 100%;" [type]="'decay-particle-emitter'"></app-particle-emitter>
