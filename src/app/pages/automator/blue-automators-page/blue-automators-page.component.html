<main class="automation-shell blue-automation">
  <header class="phase-header">
    <div class="phase-mark" aria-hidden="true"></div>
    <div><p class="eyebrow">BLUE PHASE // AUTOMATION NETWORK</p><h1>Blue Automators</h1><p class="description">Prepare the systems that bridge yellow progression into the blue phase.</p></div>
    <div class="system-status"><span class="status-dot"></span>NETWORK STATUS<strong>OPERATIONAL</strong></div>
  </header>
  <div class="automation-content">
    <section class="prestige-module">
      <div class="prestige-heading"><div><p class="eyebrow">PRE-BLUE SYSTEMS</p><h2>Yellow One-time Upgrades</h2></div><span class="module-code">PRE // B-00</span></div>
      <div class="prestige-row"><app-automator [automator]="yellowOneTimeUpgrades"></app-automator></div>
    </section>
  </div>
  <app-info class="page-info" [name]="'blue-automators-info'" [infoText]="infoText"></app-info>
</main>
