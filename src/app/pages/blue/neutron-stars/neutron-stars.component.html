<app-number-display [holding]="holdingRecord.getBlueLight()"></app-number-display>
<div *ngIf="displayBlueLight" class="upgrade-row">
  <div *ngFor="let upgrade of upgrades">
    <app-upgrade *ngIf="upgrade.unlocked" [upgrade]="upgrade"></app-upgrade>
  </div>
</div>
<div *ngIf="displayBlueLight" class="upgrade-row">
  <div *ngFor="let upgrade of onetimeUpgrades">
    <app-upgrade *ngIf="upgrade.unlocked" [upgrade]="upgrade"></app-upgrade>
  </div>
</div>
<div *ngIf="displayBlueLight" class="holding-line">
  <p class="holding-prefix">Blue light generation is also based on the amount of fusion you have.</p>
  <p class="holding-prefix">The effect is {{ getYellowFusionToBlueLightEffect() }}.</p>
</div>
<div class="upgrade-row">
  <div>
    <app-upgrade *ngIf="neutronStar.unlocked" [upgrade]="neutronStar"></app-upgrade>
  </div>
</div>
<app-particle-emitter style="width: 100%; height: 100%;" [type]="'light-particle-emitter'"></app-particle-emitter>
