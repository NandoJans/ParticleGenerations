<div class="actions" style="display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap: wrap;">
  <app-button [style]="'button green'" (click)="start()" [text]="'Start'"></app-button>
  <app-button [style]="'button'" (click)="saveSnapshot('Manual')" [text]="'Save snapshot'"></app-button>
</div>

<div class="layout" style="display:flex; gap:16px; align-items:flex-start; flex-wrap: wrap;">
  <div class="results-pane" style="flex:1; min-width: 320px;">
    <table class="results">
      <thead>
        <tr>
          <th>Name</th>
          <th>Reach time</th>
          <th>Total time</th>
          <th>Action</th>
        </tr>
      </thead>
      @for (result of getResults(); track result) {
        <tr>
          <td [class]="result.style+' name'">{{ result.element }}</td>
          <td [style.color]="getColorCode(result.timeBetween)">{{ formatTime(result.timeBetween) }}</td>
          <td>{{ formatTime(result.time) }}</td>
          <td>
            @if (result.snapshotId) {
              <div style="display:flex; gap:6px;">
                <app-button [style]="'button red'" (click)="backtrackTo(result.snapshotId)" [text]="'Revert'"></app-button>
                <app-button [style]="'button blue'" (click)="playFrom(result.snapshotId)" [text]="'Play'"></app-button>
              </div>
            }
          </td>
        </tr>
      }
    </table>
  </div>
</div>
